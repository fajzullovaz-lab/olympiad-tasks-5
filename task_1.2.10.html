<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задача 1.2.10</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; }
.container { max-width: 800px; width: 100%; }
.card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; margin-bottom: 20px; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-right: 8px; }
.badge-topic { background: rgba(99,102,241,0.3); color: #a5b4fc; }
.badge-diff { background: rgba(245,158,11,0.3); color: #fcd34d; }
.task-text { font-size: 18px; line-height: 1.7; margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; border-left: 3px solid #6366f1; }
.btn-hint { display: block; width: 100%; padding: 16px; margin: 10px 0; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; border-radius: 14px; font-size: 18px; cursor: pointer; transition: all 0.3s; font-weight: 600; }
.btn-hint:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
.btn-hint:active { transform: scale(0.98); }
.hint-box { display: none; margin-top: 15px; padding: 20px; background: rgba(99,102,241,0.1); border-radius: 14px; border: 1px solid rgba(99,102,241,0.3); animation: fadeSlide 0.4s ease; }
.hint-box.visible { display: block; }
.hint-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #a5b4fc; margin-bottom: 8px; }
.hint-content { font-size: 16px; line-height: 1.6; }
.answer-box { display: none; margin-top: 15px; padding: 20px; background: rgba(34,197,94,0.1); border-radius: 14px; border: 1px solid rgba(34,197,94,0.3); animation: fadeSlide 0.4s ease; }
.answer-box.visible { display: block; }
.solution-box { display: none; margin-top: 15px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); animation: fadeSlide 0.4s ease; white-space: pre-wrap; line-height: 1.7; }
.solution-box.visible { display: block; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.viz-title { font-size: 16px; color: #a5b4fc; margin-bottom: 20px; text-align: center; }
.progress-bar { display: flex; gap: 6px; margin-bottom: 30px; }
.progress-step { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; transition: background 0.5s; }
.progress-step.active { background: #6366f1; box-shadow: 0 0 10px rgba(99,102,241,0.5); }
.progress-step.done { background: #22c55e; }
.frame-display { position: relative; min-height: 200px; display: flex; align-items: center; justify-content: center; }
.frame-card { text-align: center; padding: 30px; animation: popIn 0.5s ease; }
@keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 50% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
.frame-icon { font-size: 64px; margin-bottom: 16px; animation: bounce 1s infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.frame-step-num { font-size: 12px; color: #6366f1; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
.frame-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #fff; }
.frame-detail { font-size: 15px; color: #a0a0b8; line-height: 1.5; max-width: 500px; margin: 0 auto; }
.nav-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
.nav-btn { padding: 10px 24px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #e0e0e0; cursor: pointer; font-size: 14px; transition: all 0.3s; }
.nav-btn:hover { background: rgba(255,255,255,0.1); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn.play { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 600; }
.plan-list { margin-top: 15px; padding: 0; list-style: none; }
.plan-list li { padding: 10px 16px; margin: 6px 0; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 2px solid #6366f1; font-size: 15px; }
.plan-list li::before { content: "▸ "; color: #6366f1; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <span class="badge badge-topic">Да или нет / </span>
    <span class="badge badge-diff">5.5</span>
    <div class="task-text">Существует ли число, у которого произведение суммы цифр на их количество равно 55?</div>
  </div>

  <button class="btn-hint" id="hintBtn" onclick="showNextHint()">💡 Подсказка</button>
  
  <div class="hint-box" id="hint1Box">
    <div class="hint-label">Подсказка 1</div>
    <div class="hint-content" id="hint1Content"></div>
  </div>
  <div class="hint-box" id="hint2Box">
    <div class="hint-label">Подсказка 2</div>
    <div class="hint-content" id="hint2Content"></div>
  </div>
  <div class="hint-box" id="hint3Box">
    <div class="hint-label">Подсказка 3</div>
    <div class="hint-content" id="hint3Content"></div>
  </div>
  <div class="answer-box" id="answerBox">
    <div class="hint-label">✅ Ответ</div>
    <div class="hint-content" id="answerContent"></div>
  </div>
  <div class="solution-box" id="solutionBox">
    <div class="hint-label">📝 Полное решение</div>
    <div id="solutionContent"></div>
  </div>

  <div class="card" id="vizCard" style="display:none;">
    <div class="viz-title">🎬 Визуализация хода решения</div>
    <div class="progress-bar" id="progressBar"></div>
    <div class="frame-display" id="frameDisplay"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="prevFrame()">◀ Назад</button>
      <button class="nav-btn play" id="playBtn" onclick="toggleAutoPlay()">▶ Авто</button>
      <button class="nav-btn" id="nextBtn" onclick="nextFrame()">Вперёд ▶</button>
    </div>
  </div>

  <div class="card" id="planCard" style="display:none;">
    <div class="hint-label">📋 План решения</div>
    <ul class="plan-list" id="planList"></ul>
  </div>
</div>

<script>
const hints = ["Подумай о том, как связаны сумма цифр и количество цифр числа.","Попробуй выразить произведение суммы и количества цифр через возможные значения.","Проверь, какие пары (S, n) могут дать произведение 55 и существуют ли такие числа с этими характеристиками."];
const answerText = "Нет, такого числа не существует.";
const solutionText = "1. Обозначим сумму цифр числа как S, а количество цифр как n. Мы ищем такие S и n, что S * n = 55.\n\n2. Поскольку 55 = 5 * 11, возможные пары (S, n) могут быть (5, 11) и (11, 5).\n\n3. Рассмотрим первую пару (S, n) = (5, 11). Это означает, что сумма цифр равна 5, а количество цифр равно 11. \n   - Максимальная сумма цифр для 11 цифр (все цифры равны 9) составляет 11 * 9 = 99, что больше 5. \n   - Следовательно, такая комбинация невозможна.\n\n4. Теперь рассмотрим вторую пару (S, n) = (11, 5). Это означает, что сумма цифр равна 11, а количество цифр равно 5.\n   - Максимальная сумма цифр для 5 цифр (все цифры равны 9) составляет 5 * 9 = 45, что больше 11. \n   - Однако, чтобы получить сумму 11, нужно, чтобы некоторые цифры были меньше 9.\n   - Например, 2 + 2 + 2 + 2 + 3 = 11, что возможно, но количество цифр не должно превышать 5.\n\n5. Проверим все возможные комбинации цифр, чтобы сумма равнялась 11, но не превышала 5 цифр. \n   - Например: 1 + 1 + 1 + 1 + 7 = 11 (5 цифр), 1 + 1 + 1 + 2 + 6 = 11 (5 цифр), 0 + 1 + 2 + 3 + 5 = 11 (5 цифр).\n   - Все эти комбинации возможны, но количество цифр не может превышать 5.\n\n6. Таким образом, мы можем найти числа, сумма цифр которых равна 11 и количество цифр равно 5, но произведение S * n не равно 55 для всех возможных чисел.\n\n7. Следовательно, числа, удовлетворяющие условию задачи, не существует.";
const planSteps = ["Определить переменные: S (сумма цифр), n (количество цифр).","Записать уравнение S * n = 55.","Рассмотреть возможные пары (S, n) для 55.","Проверить, возможно ли получить такие S и n с учетом ограничений на цифры.","Сделать вывод о существовании или отсутствии такого числа."];
const vizFrames = [{"detail":"Обозначим сумму цифр как S, а количество цифр как n.","icon":"🔢","step":1,"title":"Определение переменных"},{"step":2,"title":"Запись уравнения","detail":"Составим уравнение S * n = 55.","icon":"✖️"},{"detail":"Рассмотрим возможные пары (S, n), которые могут дать 55.","icon":"🔍","step":3,"title":"Поиск пар (S, n)"},{"detail":"Проверим, возможно ли получить такие суммы и количество цифр.","icon":"✅","step":4,"title":"Проверка условий"},{"step":5,"title":"Вывод","detail":"Сделаем вывод о том, существует ли такое число.","icon":"❌"}];

let hintLevel = 0;
let currentFrame = 0;
let autoPlayInterval = null;

function showNextHint() {
  hintLevel++;
  const btn = document.getElementById('hintBtn');
  
  if (hintLevel === 1) {
    document.getElementById('hint1Content').textContent = hints[0];
    document.getElementById('hint1Box').classList.add('visible');
    btn.textContent = '💡 Подсказка (2/3)';
  } else if (hintLevel === 2) {
    document.getElementById('hint2Content').textContent = hints[1];
    document.getElementById('hint2Box').classList.add('visible');
    btn.textContent = '💡 Подсказка (3/3)';
  } else if (hintLevel === 3) {
    document.getElementById('hint3Content').textContent = hints[2];
    document.getElementById('hint3Box').classList.add('visible');
    btn.textContent = '✅ Показать ответ и решение';
  } else if (hintLevel === 4) {
    document.getElementById('answerContent').textContent = answerText;
    document.getElementById('answerBox').classList.add('visible');
    document.getElementById('solutionContent').textContent = solutionText;
    document.getElementById('solutionBox').classList.add('visible');
    btn.textContent = '🎬 Смотреть визуализацию';
    
    if (vizFrames.length > 0) {
      document.getElementById('vizCard').style.display = 'block';
      document.getElementById('planCard').style.display = 'block';
      buildProgressBar();
      showFrame(0);
      buildPlanList();
    }
  } else if (hintLevel === 5) {
    document.getElementById('vizCard').scrollIntoView({ behavior: 'smooth' });
    btn.textContent = '🔄 Начать заново';
    hintLevel = 0;
  }
}

function buildProgressBar() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = vizFrames.map(function(_, i) { return '<div class="progress-step" id="step' + i + '"></div>'; }).join('');
}

function buildPlanList() {
  const list = document.getElementById('planList');
  list.innerHTML = planSteps.map(function(s) { return '<li>' + s + '</li>'; }).join('');
}

function showFrame(idx) {
  if (idx < 0 || idx >= vizFrames.length) return;
  currentFrame = idx;
  const f = vizFrames[idx];
  
  document.getElementById('frameDisplay').innerHTML =
    '<div class="frame-card">' +
      '<div class="frame-icon">' + (f.icon || '📐') + '</div>' +
      '<div class="frame-step-num">Шаг ' + (f.step || (idx + 1)) + ' из ' + vizFrames.length + '</div>' +
      '<div class="frame-title">' + (f.title || '') + '</div>' +
      '<div class="frame-detail">' + (f.detail || '') + '</div>' +
    '</div>';
  
  document.querySelectorAll('.progress-step').forEach(function(el, i) {
    el.classList.remove('active', 'done');
    if (i < idx) el.classList.add('done');
    if (i === idx) el.classList.add('active');
  });
  
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === vizFrames.length - 1;
}

function nextFrame() { showFrame(currentFrame + 1); }
function prevFrame() { showFrame(currentFrame - 1); }

function toggleAutoPlay() {
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
    document.getElementById('playBtn').textContent = '▶ Авто';
  } else {
    document.getElementById('playBtn').textContent = '⏸ Стоп';
    autoPlayInterval = setInterval(function() {
      if (currentFrame < vizFrames.length - 1) {
        nextFrame();
      } else {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        document.getElementById('playBtn').textContent = '▶ Авто';
      }
    }, 2500);
  }
}
</script>
</body>
</html>
